[project]
name = "matnocr"
version = "0.1.0"
description = "Fast local OCR for scanned PDFs on Windows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]
dependencies = [
    "pypdfium2>=5.13.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "winrt-windows-foundation>=3.2.1",
    "winrt-windows-foundation-collections>=3.2.1",
    "winrt-windows-globalization>=3.2.1",
    "winrt-windows-graphics-imaging>=3.2.1",
    "winrt-windows-media-ocr>=3.2.1",
    "winrt-windows-storage-streams>=3.2.1",
]

[project.scripts]
matnocr = "matnocr.cli:app"

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "ty>=0.0.78",
]

[tool.ruff]
target-version = "py311"
line-length = 88
# Historical experiments with private paths are not part of the package.
extend-exclude = ["prototype.py", "add_new_white_page.py", ".uv-cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.11"
python-platform = "win32"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "integration: exercises real PDFium or Windows OCR components",
]

[tool.coverage.run]
source = ["matnocr"]
branch = true

[tool.coverage.report]
show_missing = true
